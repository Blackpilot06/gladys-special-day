<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psst… Gladys 👀</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--b1:#ffe0ea;--b2:#fff3d6;--ink:#4a2a3a;--card:rgba(255,255,255,.62);--pink:#ff6fa5;--gold:#f0b94a;--soft:rgba(255,111,165,.14)}
@media(prefers-color-scheme:dark){:root{--b1:#2c1531;--b2:#3b2616;--ink:#fde8f0;--card:rgba(62,36,62,.6);--soft:rgba(255,111,165,.22)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Poppins,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--b1),var(--b2)) fixed;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
h1,h2,.btn,.big{font-family:Fredoka,sans-serif}
#app{position:relative;z-index:3;width:min(94vw,440px);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.5);border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 14px 40px rgba(255,111,165,.25);animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
h2{font-size:1.45rem;margin:.4em 0;font-weight:600}
p{line-height:1.5;margin:.5em 0 1em}
.big{font-size:84px;line-height:1.1;margin:6px 0}
.bounce{animation:bn 1s infinite}.shake{animation:sk .5s infinite}.pulse{animation:pl 1.2s infinite}.dance{animation:dn .8s infinite alternate}
@keyframes bn{50%{transform:translateY(-16px)}}@keyframes sk{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes pl{50%{transform:scale(1.2)}}@keyframes dn{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(10deg) scale(1.12)}}
.btn{border:0;cursor:pointer;font-size:1.1rem;font-weight:500;color:#fff;background:linear-gradient(135deg,var(--pink),#ff9a6c);padding:13px 24px;border-radius:999px;box-shadow:0 6px 16px rgba(255,111,165,.4);transition:transform .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:linear-gradient(135deg,#f0b94a,#f59e6b)}
.prog{font-size:.72rem;letter-spacing:.08em;margin-bottom:8px}.back{display:block;margin:0 auto 10px 0;border:1.5px solid var(--pink);background:rgba(255,255,255,.85);color:#4a2a3a;font:500 .95rem Poppins,sans-serif;padding:8px 16px;min-height:40px;border-radius:99px;cursor:pointer;box-shadow:0 3px 10px rgba(255,111,165,.25)}.lockbox{background:var(--soft);border-radius:18px;padding:16px;margin:14px 0;font-size:1.05rem;line-height:1.5}
.bar{height:6px;background:var(--soft);border-radius:9px;margin:6px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .5s}
.yn{display:flex;gap:14px;justify-content:center;align-items:center;min-height:90px;margin-top:10px}
#no{transition:left .38s cubic-bezier(.34,1.7,.5,1),top .38s cubic-bezier(.34,1.7,.5,1),transform .38s cubic-bezier(.34,1.7,.5,1);background:#b9a7b0;box-shadow:none}
#no.run{position:fixed;z-index:20;margin:0}
.wig{animation:wg .4s}@keyframes wg{25%{transform:rotate(-8deg) scale(1.1)}75%{transform:rotate(8deg) scale(1.1)}}
.fl{position:fixed;font-size:30px;z-index:30;pointer-events:none;animation:up 1.1s forwards}
@keyframes up{to{transform:translateY(-70px) scale(1.4);opacity:0}}
#ln{min-height:3.4em;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:1.1rem;margin:6px 0 0;line-height:1.3}
.tx{min-height:1.4em;margin:8px 0;font-weight:500;animation:in .3s}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{border:2px solid transparent;background:var(--soft);color:var(--ink);font:500 1rem Poppins,sans-serif;padding:12px;border-radius:16px;cursor:pointer;text-align:left;transition:.15s}
.opt.on{border-color:var(--pink);background:rgba(255,111,165,.3)}
.react .big{font-size:110px}
.gif{height:220px;border-radius:18px}
input[type=range]{width:100%;accent-color:var(--pink);margin:14px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.cal b{font-size:.72rem}
.d{aspect-ratio:1;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font:500 .95rem Poppins,sans-serif;cursor:pointer}
.d.on{background:var(--pink);color:#fff}.d.lock{opacity:.4;cursor:not-allowed}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.slots .opt{padding:9px 12px}
.msg{background:var(--soft);border-radius:20px;padding:16px;text-align:left;line-height:1.65;font-size:.95rem;max-height:46vh;overflow:auto;margin:12px 0}
.msg p{margin:0 0 .9em}
.badge{display:inline-block;background:linear-gradient(135deg,var(--gold),#f59e6b);color:#fff;padding:7px 16px;border-radius:99px;font-family:Fredoka;margin:6px 0}
.sum{text-align:left;font-size:.82rem;max-height:34vh;overflow:auto;margin:10px 0;padding:0;list-style:none}
.sum li{padding:6px 0;border-bottom:1px solid var(--soft)}
a.wa{display:inline-block;margin-top:10px;color:var(--ink);font-weight:500}
.bl{position:fixed;bottom:-120px;z-index:1;animation:fy linear infinite;opacity:.75;pointer-events:none}
@keyframes fy{to{transform:translateY(-120vh) rotate(20deg)}}
#cv{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
@media(prefers-reduced-motion:reduce){.bounce,.shake,.pulse,.dance,.bl{animation:none}}
:root{--ov:rgba(255,236,242,.82);--ov0:rgba(255,236,242,0)}
@media(prefers-color-scheme:dark){:root{--ov:rgba(30,15,35,.85);--ov0:rgba(30,15,35,0)}}

function react(r,after){show(`<div class="react">${media(r)}<h2>${r.m}</h2>${r.sub?`<p style="font-size:1.1rem">${r.sub}</p>`:""}</div>`);
 if(r.cls){const b=app.querySelector(".big");if(b)b.className="big "+r.cls}
 if(r.fx){for(let k=0;k<26;k++)setTimeout(()=>{const f=document.createElement("div");f.className="bl";f.textContent=r.fx[k%r.fx.length];f.style.cssText=`left:${Math.random()*92}vw;bottom:-40px;z-index:35;font-size:${26+Math.random()*22}px;animation-duration:${3+Math.random()*2.5}s`;document.body.appendChild(f);setTimeout(()=>f.remove(),5600)},k*130)}
 if(r.photo)document.body.classList.add("photo");
 confetti(r.fx?200:110);setTimeout(()=>{if(r.photo)document.body.classList.remove("photo");after()},C.reactionMs)}
function next(){i++;draw()}
app.addEventListener("click",e=>{if(e.target.id==="bk")review(ans.length-1)});
function review(j){document.body.classList.toggle("photo",!!(ans[j].r&&ans[j].r.photo));
 show(`<div class="prog">REVIEWING QUESTION ${j+1} OF ${total}</div><div class="bar"><i style="width:${(j+1)/total*100}%"></i></div><h2>${ans[j].q}</h2><div class="lockbox">Your answer 🔒<br><b>${ans[j].a}</b></div><p style="font-size:.85rem">Look all you like, answers can't be changed 😉</p><div class="yn" style="min-height:0">${j>0?'<button class="btn alt" id="rb">← Back</button>':''}<button class="btn" id="rn">${j<ans.length-1?"Next ➜":"Back to my question ➜"}</button></div>`);
 const rb=$("#rb");if(rb)rb.onclick=()=>review(j-1);
 $("#rn").onclick=()=>{if(j<ans.length-1)review(j+1);else{document.body.classList.remove("photo");qn--;draw()}}}
function toast(r){const t=$("#tx");if(t){t.innerHTML=r.e+" "+r.m;confetti(40)}}
const sentry=()=>{const s=C.steps;return s[i]};
function draw(){const s=sentry();
 if(["yn","sl","mc","mu","cal"].includes(s.t))qn++;
 ({s:()=>show(`<div class="big ${s.a}">${s.e}</div><h2>${s.h}</h2><p>${s.p}</p><button class="btn" id="go">${s.b}</button>`)||($("#go").onclick=next),
 yn,sl,mc,mu,cal,msg,fin}[s.t==="s"?"s":s.t])();
 if(s.t==="s"&&0){}}
function yn(){const s=sentry();let n=0,yS=1,moved=false,ph;
 show(head()+`<h2>${s.q}</h2><div id="ln"></div><div class="yn"><button class="btn" id="yes">Yes 💖</button><button class="btn" id="no">No</button></div>`);
 const y=$("#yes"),no=$("#no");
 y.onclick=()=>{ans.push({q:s.q,a:"Yes 💖",r:s.r});react(s.r,next)};
 function go(e){e.preventDefault();e.stopPropagation();const r=no.getBoundingClientRect();
  if(!moved){moved=true;ph=document.createElement("span");ph.style.cssText=`width:${r.width}px;height:${r.height}px`;no.before(ph);no.classList.add("run");}
  n++;const fl=document.createElement("div");fl.className="fl";fl.textContent=C.floaters[n%C.floaters.length];fl.style.left=r.left+r.width/2-15+"px";fl.style.top=r.top+"px";document.body.appendChild(fl);setTimeout(()=>fl.remove(),1100);
  y.classList.remove("wig");y.offsetWidth;y.classList.add("wig");yS=Math.min(2,1+.12*n);y.style.transform=`scale(${yS})`;
  navigator.vibrate&&navigator.vibrate(30);
  no.textContent=C.noTexts[(n-1)%C.noTexts.length];$("#ln").textContent=C.lines[(n-1)%C.lines.length];
  const sc=Math.max(.55,1-.08*n),rot=(Math.random()-.5)*50,w=no.offsetWidth,h=no.offsetHeight,vw=innerWidth,vh=innerHeight,yr=y.getBoundingClientRect();
  const ox=r.left+r.width/2,oy=r.top+r.height/2,min=.45*Math.min(vw,vh);let X=0,Y=0;
  for(let k=0;k<60;k++){X=8+Math.random()*(vw-w-16);Y=8+Math.random()*(vh-h-16);
   const far=Math.hypot(X+w/2-ox,Y+h/2-oy)>=min,hit=X<yr.right+14&&X+w>yr.left-14&&Y<yr.bottom+14&&Y+h>yr.top-14;if(far&&!hit)break}
  no.style.left=X+"px";no.style.top=Y+"px";no.style.transform=`rotate(${rot}deg) scale(${sc})`;
  if(n%2===0){const t=C.nope;$("#ln").innerHTML=t.e+" "+t.m;confetti(25)}}
 no.addEventListener("click",go);no.addEventListener("pointerenter",e=>{if(moved)go(e)});no.addEventListener("touchstart",e=>{if(moved)go(e)},{passive:false})}
function sl(){const s=sentry();const L=C.slider;
 show(head()+`<h2>${s.q}</h2><div class="big" id="se">${L[0][0]}</div><div class="h2" id="sl2" style="font-weight:500">${L[0][1]}</div><input type="range" id="r" min="0" max="6" value="0"><button class="btn" id="go">Lock it in 🔒</button>`);
 const r=$("#r");r.oninput=()=>{$("#se").textContent=L[r.value][0];$("#sl2").textContent=L[r.value][1];if(r.value>=5)confetti(20)};
 $("#go").onclick=()=>{ans.push({q:s.q,a:L[r.value][0]+" "+L[r.value][1]});confetti();setTimeout(next,500)}}
function mc(){const s=sentry();
 show(head()+`<h2>${s.q}</h2><div class="opts">${s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join("")}</div>`);
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=s.o[b.dataset.k];ans.push({q:s.q,a:o[0],r:o[1]});react(o[1],next)})}
function mu(){const s=sentry();const sel=new Set();
 show(head()+`<h2>${s.q}</h2><p style="margin:0">Pick as many as you like</p><div class="tx" id="tx"></div><div class="opts">${s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join("")}</div><button class="btn" id="go">Next ➜</button>`);
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel.has(k)){sel.delete(k);b.classList.remove("on");$("#tx").textContent=""}else{sel.add(k);b.classList.add("on");toast(s.o[k][1])}});
 $("#go").onclick=()=>{if(!sel.size){$("#tx").textContent="Pick at least one 🎁";return}
  wishes=[...sel].map(k=>s.o[k][0]);ans.push({q:s.q,a:wishes.join(", ")});next()}}
function cal(){const s=sentry();const D=new Set(),S=new Set();
 let g=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<b>${d}</b>`).join("")+"<span></span>";
 for(let d=1;d<=31;d++)g+=d===12||d===13?`<button class="d lock" disabled>🔒</button>`:`<button class="d" data-d="${d}">${d}</button>`;
 show(head()+`<h2>${s.q}</h2><p style="margin:0;font-size:.85rem">${s.sub}</p><div class="tx" id="tx"></div><b>December 2026</b><div class="cal">${g}</div><div class="slots">${C.slots.map((t,k)=>`<button class="opt" data-s="${k}">${t}</button>`).join("")}</div><button class="btn" id="go">Next ➜</button>`);
 document.querySelectorAll(".d[data-d]").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(D.has(d)){D.delete(d);b.classList.remove("on")}else{D.add(d);b.classList.add("on");toast(C.calReact)}});
 document.querySelectorAll(".slots .opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.s;S.has(k)?S.delete(k):S.add(k);b.classList.toggle("on")});
 $("#go").onclick=()=>{if(!D.size){$("#tx").textContent="Tap at least one day 📅";return}
  days=[...D].sort((a,b)=>a-b).map(d=>d+" Dec");slots=[...S].map(k=>C.slots[k]);
  ans.push({q:s.q,a:days.join(", ")+(slots.length?" · "+slots.join(", "):"")});next()}}
function msg(){document.body.classList.add("photo");show(`<div class="big dance">🎂❤️🎈</div><h2>Happy birthday, Gladys!</h2><div style="font-size:1.6rem">❤️😭🎂</div><div class="msg">${C.message.map(p=>`<p>${p}</p>`).join("")}</div><button class="btn" id="go">Continue 🎂</button>`);
 confetti(220);setTimeout(()=>confetti(120),500);$("#go").onclick=next}
const summary=()=>"Gladys's answers 💌\n"+ans.map(x=>"• "+x.q+" → "+x.a).join("\n");
function fin(){const wa=`https://wa.me/${C.wa}?text=${encodeURIComponent(summary())}`;
 show(`<div class="big dance">👑🎂👑</div><h2>Certified Birthday Queen</h2><div class="badge">Happy Birthday, Gladys! 🎉</div><ul class="sum">${ans.map(x=>`<li><b>${x.q}</b><br>${x.a}</li>`).join("")}</ul><button class="btn" id="send">Send my answers to Jeff 💌</button><div class="tx" id="st"></div><a class="wa" href="${wa}" target="_blank" rel="noopener">Send on WhatsApp 💬</a>`);
 confetti(150);const b=$("#send");
 b.onclick=async()=>{window.open(wa,"_blank");b.disabled=true;
  const body={answers:summary(),wishes:wishes.join(", "),"free-days":days.join(", "),"time-slots":slots.join(", "),"submitted-at":new Date().toISOString(),_gotcha:""};
  try{if(C.formEndpoint.includes("YOUR_FORM_ID"))throw 0;
   const r=await fetch(C.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)});if(!r.ok)throw 0;
   sent=true;$("#st").textContent="Sent to Jeff! 🥳";confetti(200)}
  catch(e){b.disabled=false;$("#st").textContent="Couldn't save it online, but the WhatsApp message is ready 💬"}}}
draw();
</script></body></html>
